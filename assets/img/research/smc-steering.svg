<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title description">
  <title id="title">Language-model steering with twisted SMC</title>
  <desc id="description">A learned twisting function guides proposals from a frozen language model. Sequence particles are importance weighted and adaptively resampled.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="518" height="318" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="260" y="37" fill="#1e3a8a" font-size="27" font-weight="600">Learned twisting function</text>
    <text x="260" y="64" fill="#64748b" font-size="20">Guides token proposals</text>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M260 76 V94" />
      <path d="M114 145 V194" />
      <path d="M187 145 V184" />
      <path d="M260 145 V193" />
      <path d="M333 145 V187" />
      <path d="M406 145 V194" />
      <path d="M187 222 L100 268" />
      <path d="M187 222 L180 268" />
      <path d="M187 222 L260 268" />
      <path d="M333 219 L340 268" />
      <path d="M333 219 L420 268" />
    </g>
    <g fill="#dbeafe" stroke="#1e3a8a" stroke-width="2">
      <circle cx="114" cy="133" r="12" />
      <circle cx="187" cy="133" r="12" />
      <circle cx="260" cy="133" r="12" />
      <circle cx="333" cy="133" r="12" />
      <circle cx="406" cy="133" r="12" />
    </g>
    <text x="260" y="113" fill="#475569" font-size="18">Sequence particles</text>
    <g fill="#1e3a8a">
      <circle cx="114" cy="204" r="6" opacity=".35" />
      <circle cx="187" cy="204" r="16" />
      <circle cx="260" cy="204" r="7" opacity=".4" />
      <circle cx="333" cy="204" r="13" opacity=".8" />
      <circle cx="406" cy="204" r="6" opacity=".35" />
    </g>
    <rect x="154" y="158" width="212" height="25" rx="4" fill="#f8fafc" />
    <text x="260" y="177" fill="#475569" font-size="18">Importance weighting</text>
    <g fill="#dbeafe" stroke="#1e3a8a" stroke-width="2">
      <circle cx="100" cy="282" r="12" />
      <circle cx="180" cy="282" r="12" />
      <circle cx="260" cy="282" r="12" />
      <circle cx="340" cy="282" r="12" />
      <circle cx="420" cy="282" r="12" />
    </g>
    <rect x="149" y="231" width="222" height="25" rx="4" fill="#f8fafc" />
    <text x="260" y="250" fill="#475569" font-size="18">Adaptive resampling</text>
  </g>
</svg>

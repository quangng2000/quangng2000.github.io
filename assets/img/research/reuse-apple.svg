<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title description">
  <title id="title">RE-USE Apple shared inference engine</title>
  <desc id="description">Recorded audio is enhanced by a shared Swift, MLX, and Metal engine. A Mac CLI and iPhone/iPad app target use the same engine; M4 Pro GPU inference has been verified.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="518" height="318" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="260" y="40" fill="#1e3a8a" font-size="28" font-weight="600">RE-USE Apple</text>
    <text x="260" y="69" fill="#64748b" font-size="18">Offline speech enhancement</text>
    <g fill="#fff" stroke="#cbd5e1" stroke-width="2">
      <rect x="24" y="95" width="132" height="65" rx="9" />
      <rect x="364" y="95" width="132" height="65" rx="9" />
    </g>
    <g fill="#334155" font-size="18">
      <text x="90" y="122">Recorded</text>
      <text x="90" y="147">audio</text>
      <text x="430" y="122">Enhanced</text>
      <text x="430" y="147">16 kHz WAV</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M156 127 H183" />
      <path d="M336 127 H362" />
    </g>
    <rect x="185" y="95" width="150" height="65" rx="9" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2" />
    <text x="260" y="122" fill="#1e3a8a" font-size="20" font-weight="600">Shared engine</text>
    <text x="260" y="146" fill="#1e3a8a" font-size="17">Swift · MLX · Metal</text>
    <text x="260" y="191" fill="#64748b" font-size="17">NVIDIA pretrained model · 9.61M parameters</text>
    <g fill="#fff" stroke="#cbd5e1" stroke-width="2">
      <rect x="53" y="212" width="188" height="58" rx="9" />
      <rect x="279" y="212" width="188" height="58" rx="9" />
    </g>
    <g fill="#334155" font-size="18">
      <text x="147" y="247">Mac CLI</text>
      <text x="373" y="247">iPhone / iPad app</text>
    </g>
    <text x="260" y="297" fill="#64748b" font-size="16">M4 Pro tested · Mobile device testing pending</text>
  </g>
</svg>

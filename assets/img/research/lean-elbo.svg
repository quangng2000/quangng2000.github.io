<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title description">
  <title id="title">ELBO identity formalized in Lean 4</title>
  <desc id="description">
    For finite, strictly positive distributions, log evidence equals the evidence lower bound plus the nonnegative KL divergence from q to the
    posterior.
  </desc>
  <rect x="1" y="1" width="518" height="298" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="260" y="43" fill="#64748b" font-size="22" font-weight="600">ELBO · Lean 4</text>
    <g fill="#1e3a8a" font-size="34">
      <text x="260" y="101">log p(x) = ELBO(q)</text>
      <text x="260" y="145">+ KL(q ∥ p(·|x))</text>
    </g>
    <path d="M76 171 H444" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <rect x="44" y="191" width="432" height="57" rx="8" fill="#dbeafe" />
    <text x="260" y="228" fill="#1e3a8a" font-size="31" font-weight="600">ELBO(q) ≤ log p(x)</text>
    <text x="260" y="278" fill="#64748b" font-size="21">Finite, strictly positive distributions</text>
  </g>
</svg>

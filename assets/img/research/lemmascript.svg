<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title description">
  <title id="title">LemmaScript verification workflow</title>
  <desc id="description">LemmaScript translates TypeScript with specification annotations into Dafny or Lean 4 artifacts for formal verification.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="518" height="318" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="260" y="43" fill="#1e3a8a" font-size="32" font-weight="600">LemmaScript</text>
    <text x="260" y="71" fill="#64748b" font-size="21">TypeScript verification</text>
    <rect x="48" y="94" width="424" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <text x="260" y="126" fill="#1e3a8a" font-size="27" font-weight="600">Annotated TypeScript</text>
    <text x="260" y="154" fill="#64748b" font-size="19">requires · ensures · invariants</text>
    <path d="M260 171 V188 H144 V206" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M260 188 H376 V206" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="54" y="214" width="180" height="54" rx="8" fill="#1e3a8a" />
    <rect x="286" y="214" width="180" height="54" rx="8" fill="#1e3a8a" />
    <text x="144" y="251" fill="#ffffff" font-size="29" font-weight="600">Dafny</text>
    <text x="376" y="251" fill="#ffffff" font-size="29" font-weight="600">Lean 4</text>
    <text x="260" y="301" fill="#64748b" font-size="21">Verification backends</text>
  </g>
</svg>
